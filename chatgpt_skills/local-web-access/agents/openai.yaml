interface:
  display_name: local web access
  short_description: Use 4GPT and the user's local Chrome for URLs, browser search,
    current login state, or cloud-web recovery.
  default_prompt: Use my local Chrome through 4GPT to read https://example.com/ and report the read_webpage status, final URL, and page body.
policy:
  products:
  - CHAT
  allow_implicit_invocation: true
dependencies:
  tools:
  - type: mcp
    value: mcp4chatgpt
    description: Read and search webpages through the connected 4GPT local Chrome bridge.
    transport: streamable_http
    url: https://mcp.runzhe.uk/mcp
