[project]
name = "mcp4chatgpt"
version = "0.3.0"
description = "ChatGPT Web MCP server for local ops, web ops, and source-grounded knowledge workflows."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23",
    "pytest>=9.1.0",
]

[project.scripts]
mcp4chatgpt = "mcp4chatgpt.runtime:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp4chatgpt = ["native/*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
